<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager | Raje Airey</title>
  </head>
  <body>
    <script>
      // Listen for the auth message before CMS loads
      window.addEventListener("message", function(e) {
        console.log("Message received:", e.data);
      });

      // Check for stored auth and replay as postMessage when CMS is ready
      const storedAuth = localStorage.getItem("decap-cms-auth");
      if (storedAuth) {
        window.addEventListener("load", function() {
          setTimeout(function() {
            try {
              const auth = JSON.parse(storedAuth);
              if (auth.token) {
                const message = "authorization:github:success:" + JSON.stringify({
                  token: auth.token,
                  provider: "github"
                });
                console.log("Replaying auth message:", message);
                window.postMessage(message, "*");
                localStorage.removeItem("decap-cms-auth");
              }
            } catch (e) {
              console.error("Auth replay error:", e);
            }
          }, 1000); // Wait for CMS to initialize
        });
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
